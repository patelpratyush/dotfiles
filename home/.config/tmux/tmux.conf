# --------#
# General #
# --------#

# Default shell
set -g default-shell $SHELL

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# History
set -g history-limit 102400

# Set windows and page index to base 1
set -g base-index 1
setw -g pane-base-index 1

# Re-number windows when creating/closing new windows
set -g renumber-windows on

# Use emacs key bindings in status line
set-option -g status-keys emacs

# Use vim key bindings in copy mode
setw -g mode-keys vi

# Fix ESC delay in vim
set -g escape-time 10

# ------------#
# Keybindings #
# ------------#

# Set prefix to C-a
unbind C-b
set -g prefix C-a

# Copy-mode
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Send command on double press
bind C-a send-prefix
bind C-l send-keys 'C-l'

# Reload tmux.conf on prefix r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes and remember current path
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Remember current path when creating new windows
bind c new-window -c '#{pane_current_path}'

# Break pane into new window and keep focus on the current window
bind b break-pane -d

# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys 'C-\'" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# -----------#
# Status bar #
# -----------#

# Catppuccin Frappe
# base=#303446 surface0=#414559 surface1=#51576d
# blue=#8caaee green=#a6d189 mauve=#ca9ee6 text=#c6d0f5 subtext=#a5adce crust=#232634

set-option -g status-justify left
set-option -g status-bg '#303446'
set-option -g status-fg '#c6d0f5'
set-option -g status-left-length 32
set-option -g status-right-length 40

set-option -g status-left '#[bg=#303446,fg=#a6d189]#[bg=#a6d189,fg=#232634,bold]  #[bg=#232634,fg=#a6d189] #S #[bg=#303446,fg=#232634]  '
set-option -g status-right '#[bg=#303446,fg=#ca9ee6]#[bg=#ca9ee6,fg=#303446] #[bg=#414559,fg=#c6d0f5] %a %R #[bg=#303446,fg=#414559] '
set-option -g status-interval 60

set-option -g pane-active-border-style fg='#8caaee'
set-option -g pane-border-style fg='#414559'

set-window-option -g window-status-format '#[bg=#303446,fg=#414559]#[bg=#414559,fg=#a5adce] #I #[bg=#51576d,fg=#a5adce] #W#F #[bg=#303446,fg=#51576d] '
set-window-option -g window-status-current-format '#[bg=#303446,fg=#8caaee]#[bg=#8caaee,fg=#303446,bold]  #I  #W#F  #[bg=#303446,fg=#8caaee] '
